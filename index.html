<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tawan TikTok HQ Pro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Tawan TikTok HQ Pro</h1>

<p>
Compress สำหรับ TikTok คุณภาพสูง
</p>

<input
type="file"
id="video"
accept="video/*">

<br><br>

<button id="start">

เริ่มบีบอัด

</button>

<br><br>

<progress
id="progress"
value="0"
max="100"
style="width:100%;">
</progress>

<p id="status">
พร้อมทำงาน
</p>

<pre id="log"></pre>

</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

<script src="app.js"></script>

</body>
</html>
